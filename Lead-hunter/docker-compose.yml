name: lead-hunter

services:
  postgres:
    image: postgres:16-alpine
    container_name: lead-hunter-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lead
      POSTGRES_PASSWORD: lead
      POSTGRES_DB: leadhunter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lead -d leadhunter"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: lead-hunter-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # loopback-only: backend nunca exposto na internet (acesso via proxy do Next)
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      # Demos dos agentes (Nobara). Na VPS: DEMOS_DIR=/home/hermes/.openclaw/demos-shared (.env)
      - ${DEMOS_DIR:-./demos}:/demos-shared:ro
      # Uploads do GERAR SITE (fotos do IG do lead). Na VPS: DEMO_UPLOADS_DIR=/home/hermes/.openclaw/demo-uploads
      - ${DEMO_UPLOADS_DIR:-./demo-uploads}:/demo-uploads

volumes:
  pgdata:
